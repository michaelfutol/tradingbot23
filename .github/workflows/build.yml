name: Build TradingBot23.exe

on:
  push:
    branches: [main, claude/setup-trading-bot-repo-51kDL]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run paper trading regression tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use lockfile npm version
        run: npm install --global npm@10.9.2
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint web dashboard
        working-directory: web
        run: npm run lint
      - name: Build web dashboard
        working-directory: web
        run: npm run build

  build-windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller tradingbot23.spec --clean

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TradingBot23-Windows
          path: dist/TradingBot23.exe
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TradingBot23.exe

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS binary
        run: pyinstaller tradingbot23.spec --clean

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: TradingBot23-macOS
          path: dist/TradingBot23
          retention-days: 90
